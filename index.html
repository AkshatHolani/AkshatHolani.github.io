<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akshat Holani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E6EAE3;   /* pale sage paper */
    --ink:#1C2541;     /* deep navy ink */
    --muted:#55607A;
    --line:#C3CBC0;
    --marigold:#E8A33D;
    --sky:#7BA7BC;
    --clay:#B5654A;
    --display:"Familjen Grotesk", system-ui, sans-serif;
    --body:"Literata", Georgia, serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.7 var(--body);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:4px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(1.25rem,4vw,2.5rem)}
  [hidden]{display:none!important}

  /* nav */
  nav{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 0;font-family:var(--display);font-size:.95rem}
  nav .mark{font-weight:700;text-decoration:none}
  nav ul{display:flex;gap:1.5rem;list-style:none;margin:0;padding:0}
  nav ul a{text-decoration:none;color:var(--muted)}
  nav ul a:hover{color:var(--ink)}

  /* hero */
  .hero{padding:clamp(3rem,10vw,7rem) 0 clamp(3rem,7vw,5rem);display:grid;grid-template-columns:1.4fr 1fr;gap:3rem;align-items:end}
  .hero h1{font-family:var(--display);font-weight:700;font-size:clamp(3rem,9vw,7.25rem);line-height:.92;letter-spacing:-.035em;margin:0}
  .hero h1 .wave{display:inline-block;transform-origin:70% 80%;animation:wave 1.6s ease-in-out .4s 1}
  @keyframes wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(14deg)}40%,80%{transform:rotate(-8deg)}}
  .hero .intro{max-width:34ch;margin:0;color:var(--ink)}
  .hero .intro + .intro{margin-top:1rem;color:var(--muted)}
  .now{margin-top:2rem;display:flex;gap:.6rem;align-items:baseline;font-family:var(--display);font-size:.95rem;color:var(--muted)}
  .now::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--marigold);flex:none;transform:translateY(-1px)}

  /* about */
  section{padding:clamp(3rem,7vw,5rem) 0;border-top:1.5px solid var(--ink)}
  h2{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4vw,2.75rem);letter-spacing:-.02em;line-height:1.05;margin:0 0 .5rem}
  .lede{color:var(--muted);max-width:52ch;margin:0 0 2.5rem}
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
  .about-grid p{max-width:60ch;margin:0 0 1rem}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.9rem 1.5rem;font-size:1rem}
  dt{font-family:var(--display);font-weight:600}
  dd{margin:0;color:var(--muted)}
  .grades-h{font:700 1.35rem var(--display);margin:3rem 0 1rem}
  .grades{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
  .grades li{padding:1.25rem 1.5rem 0 0;border-right:1px solid var(--line);margin-right:1.5rem}
  .grades li:last-child{border-right:0;margin-right:0}
  .grades b{display:block;font:700 clamp(2.2rem,5vw,3.5rem)/1 var(--display);letter-spacing:-.03em}
  .grades span{color:var(--muted);font-size:1rem}
  @media (max-width:560px){.grades{grid-template-columns:1fr}.grades li{border-right:0;margin-right:0;border-bottom:1px solid var(--line);padding:1rem 0}}

  /* ideas */
  .filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
  .filters button{font:600 .95rem var(--display);border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:.45rem 1rem;border-radius:999px;cursor:pointer}
  .filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .ideas{list-style:none;margin:0;padding:0}
  .idea{border-bottom:1px solid var(--line)}
  .idea > button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:1fr auto 1.5rem;gap:1.5rem;align-items:center;padding:1.4rem .25rem}
  .idea > button:focus-visible{outline:3px solid var(--marigold);outline-offset:-3px}
  .idea h3{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,2.4vw,1.6rem);letter-spacing:-.01em;margin:0;line-height:1.2}
  .idea .pitch{color:var(--muted);margin:.2rem 0 0;font-size:1rem}
  .status{font:600 .85rem var(--display);padding:.25rem .7rem;border-radius:999px;white-space:nowrap;color:var(--ink)}
  .status[data-s="Brewing"]{background:var(--marigold)}
  .status[data-s="Prototyping"]{background:var(--sky)}
  .status[data-s="Shelved"]{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
  .chev{width:1.5rem;height:1.5rem;transition:transform .25s ease}
  .idea[data-open="true"] .chev{transform:rotate(45deg)}
  .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .idea[data-open="true"] .detail{grid-template-rows:1fr}
  .detail > div{overflow:hidden}
  .detail .inner{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;padding:0 .25rem 1.8rem}
  .detail h4{font:600 .95rem var(--display);margin:0 0 .3rem}
  .detail p{margin:0;font-size:.98rem;max-width:40ch}
  .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem}
  .tags span{font:400 .85rem var(--display);border:1px solid var(--line);padding:.1rem .55rem;border-radius:4px;background:#EEF1EC}
  .empty{color:var(--muted);padding:2rem 0}

  /* contact */
  .contact h2{font-size:clamp(2.2rem,6vw,4.5rem);max-width:14ch}
  .links{display:flex;flex-wrap:wrap;gap:1rem 2rem;margin-top:2rem;font-family:var(--display);font-size:1.15rem}
  .links a{text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--marigold)}
  .links a:hover{text-decoration-color:var(--ink)}
  .copy{font:600 1rem var(--display);border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:.55rem 1.1rem;border-radius:999px;cursor:pointer}
  footer{padding:2rem 0 3rem;color:var(--muted);font-size:.9rem;font-family:var(--display)}

  /* editor (only shown with #edit in the URL) */
  .pill{font:600 .95rem var(--display);border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:.45rem 1rem;border-radius:999px;cursor:pointer}
  .pill.solid{background:var(--ink);color:var(--paper)}
  .ed-fab{position:fixed;right:1rem;bottom:1rem;z-index:50;box-shadow:0 6px 20px rgba(28,37,65,.25)}
  .ed{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:60;overflow-y:auto;background:var(--paper);border-left:1.5px solid var(--ink);padding:0 1.25rem 2rem;font-family:var(--display);box-shadow:-8px 0 30px rgba(28,37,65,.15)}
  .ed-head{position:sticky;top:0;z-index:1;background:var(--paper);padding:1rem 0 .75rem;border-bottom:1px solid var(--line)}
  .ed-head .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
  .ed-head b{font-size:1.15rem}
  .ed-actions{display:flex;flex-wrap:wrap;gap:.4rem}
  .ed-actions .pill{font-size:.85rem;padding:.35rem .8rem}
  .ed .note{font-size:.82rem;color:var(--muted);line-height:1.45;margin:.6rem 0 0}
  .ed h3{font:700 1rem var(--display);margin:1.4rem 0 .4rem}
  .ed label{display:block;font:600 .82rem var(--display);margin:.6rem 0 .2rem;color:var(--muted)}
  .ed input,.ed textarea,.ed select{width:100%;font:400 .95rem var(--body);color:var(--ink);background:#F4F6F2;border:1px solid var(--line);border-radius:4px;padding:.4rem .55rem}
  .ed textarea{resize:vertical;min-height:4rem}
  .ed .row{display:grid;grid-template-columns:1fr 1fr auto;gap:.4rem;margin-bottom:.4rem;align-items:start}
  .ed .row.one{grid-template-columns:1fr auto}
  .ed .card{border:1px solid var(--line);border-radius:6px;padding:.25rem .75rem .75rem;margin-bottom:.75rem}
  .ed .card-top{display:flex;justify-content:flex-end;margin-top:.5rem}
  .ed .x{font:600 .8rem var(--display);border:1.5px solid var(--clay);color:var(--clay);background:transparent;padding:.3rem .65rem;border-radius:999px;cursor:pointer}
  .ed .x:hover{background:var(--clay);color:var(--paper)}
  .ed .add{font:600 .85rem var(--display);border:1.5px dashed var(--ink);background:transparent;color:var(--ink);padding:.35rem .8rem;border-radius:999px;cursor:pointer;margin-top:.2rem}
  @media (min-width:900px){body.ed-open{padding-right:420px}}

  @media (max-width:760px){
    .hero,.about-grid{grid-template-columns:1fr}
    .hero{gap:1.5rem}
    nav ul{gap:1rem}
    .idea > button{grid-template-columns:1fr 1.5rem;gap:.75rem}
    .idea .status{grid-column:1;justify-self:start;grid-row:2}
    .detail .inner{grid-template-columns:1fr;gap:1.2rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>

<div class="wrap">
  <nav aria-label="Main">
    <a class="mark" href="#top" id="mark"></a>
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#ideas">Ideas</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <header class="hero" id="top">
    <h1>Hi, I'm <span id="first"></span><span class="wave" aria-hidden="true">👋</span></h1>
    <div>
      <p class="intro" id="intro"></p>
      <p class="intro" id="introMore"></p>
      <p class="now" id="now"></p>
    </div>
  </header>

  <section id="about" aria-labelledby="about-h">
    <div class="about-grid">
      <div>
        <h2 id="about-h"></h2>
        <p class="lede" id="role" style="margin-bottom:1.5rem"></p>
        <div id="aboutText"></div>
      </div>
      <dl id="facts"></dl>
    </div>
    <h3 class="grades-h" id="gradesTitle"></h3>
    <ul class="grades" id="grades"></ul>
  </section>

  <section id="ideas" aria-labelledby="ideas-h">
    <h2 id="ideas-h"></h2>
    <p class="lede" id="ideasLede"></p>
    <div class="filters" role="group" aria-label="Filter by status" id="filters"></div>
    <ul class="ideas" id="ideaList"></ul>
  </section>

  <section class="contact" id="contact" aria-labelledby="contact-h">
    <h2 id="contact-h"></h2>
    <p class="lede" id="contactLede" style="margin-bottom:0"></p>
    <div class="links" id="links"></div>
  </section>

  <footer id="foot"></footer>
</div>

<button type="button" class="pill solid ed-fab" id="edOpen" hidden>✎ Edit page</button>
<aside class="ed" id="ed" aria-label="Page editor" hidden>
  <div class="ed-head">
    <div class="top"><b>Edit page</b><button type="button" class="pill" id="edClose">Close</button></div>
    <div class="ed-actions">
      <button type="button" class="pill solid" id="edDownload">Download index.html</button>
      <button type="button" class="pill" id="edCopy">Copy data</button>
      <button type="button" class="pill" id="edDiscard">Discard changes</button>
    </div>
    <p class="note" id="edNote">Changes show on the page right away and are saved in this browser only. Visitors see them after you download index.html and upload it to GitHub.</p>
  </div>
  <div id="edBody"></div>
</aside>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ORIGINAL = JSON.parse($("me-data").textContent);
const EDITOR = location.hash === "#edit";
const DRAFT_KEY = "portfolio-draft";
let ME = ORIGINAL;
if (EDITOR) {
  try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY)); if (d && typeof d === "object") ME = d; } catch {}
}
// Adding #edit to an already-open page reloads it so the editor appears
addEventListener("hashchange", () => { if ((location.hash === "#edit") !== EDITOR) location.reload(); });

/* ---------- page ---------- */
const STATUSES = ["Brewing", "Prototyping", "Shelved"];
let filter = "All";
const chev = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;

function renderPage(){
  document.title = ME.name;
  $("mark").textContent = ME.name;
  $("first").textContent = ME.firstName + " ";
  for (const k of ["intro","introMore","now","role","ideasLede","contactLede"]) $(k).textContent = ME[k] || "";
  $("about-h").textContent = ME.aboutTitle;
  $("gradesTitle").textContent = ME.gradesTitle;
  $("ideas-h").textContent = ME.ideasTitle;
  $("contact-h").textContent = ME.contactTitle;
  $("aboutText").innerHTML = ME.about.map(p => `<p>${esc(p)}</p>`).join("");
  $("facts").innerHTML = ME.facts.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  $("grades").innerHTML = ME.grades.map(([v,l]) => `<li><b>${esc(v)}</b><span>${esc(l)}</span></li>`).join("");
  $("links").innerHTML =
    (ME.email ? `<a href="mailto:${esc(ME.email)}">${esc(ME.email)}</a>` : "") +
    ME.links.map(([l,u]) => `<a href="${esc(u)}" rel="noopener">${esc(l)}</a>`).join("") +
    (ME.email ? `<button class="copy" id="copyBtn" type="button">Copy email</button>` : "");
  $("foot").textContent = `© ${new Date().getFullYear()} ${ME.name}`;
  renderFilters(); renderIdeas();
}
function renderFilters(){
  const statuses = ["All", ...new Set(ME.ideas.map(i => i.status))];
  if (!statuses.includes(filter)) filter = "All";
  $("filters").hidden = !ME.ideas.length;
  $("filters").innerHTML = statuses.map(s => {
    const n = s === "All" ? ME.ideas.length : ME.ideas.filter(i => i.status === s).length;
    return `<button type="button" aria-pressed="${s===filter}" data-f="${esc(s)}">${esc(s)} (${n})</button>`;
  }).join("");
}
function renderIdeas(){
  const list = ME.ideas.map((i, idx) => [i, idx]).filter(([i]) => filter === "All" || i.status === filter);
  const empty = ME.ideas.length ? "No projects with this status yet." : "No projects yet. Check back soon.";
  $("ideaList").innerHTML = list.length ? list.map(([i, idx]) => {
    const stack = i.stack || [];
    return `
    <li class="idea" data-open="false">
      <button type="button" aria-expanded="false" aria-controls="d${idx}">
        <span><h3>${esc(i.title)}</h3>${i.pitch ? `<p class="pitch">${esc(i.pitch)}</p>` : ""}</span>
        <span class="status" data-s="${esc(i.status)}">${esc(i.status)}</span>
        ${chev}
      </button>
      <div class="detail" id="d${idx}"><div><div class="inner">
        ${i.problem ? `<div><h4>The problem</h4><p>${esc(i.problem)}</p></div>` : ""}
        ${i.approach ? `<div><h4>My plan</h4><p>${esc(i.approach)}</p></div>` : ""}
        ${stack.length ? `<div><h4>Likely tools</h4><div class="tags">${stack.map(t => `<span>${esc(t)}</span>`).join("")}</div></div>` : ""}
      </div></div></div>
    </li>`;
  }).join("") : `<li class="empty">${empty}</li>`;
}

$("links").addEventListener("click", async e => {
  const b = e.target.closest("#copyBtn"); if (!b) return;
  try { await navigator.clipboard.writeText(ME.email); b.textContent = "Email copied"; }
  catch { b.textContent = ME.email; }
  setTimeout(() => b.textContent = "Copy email", 2200);
});
$("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f; renderFilters(); renderIdeas();
});
$("ideaList").addEventListener("click", e => {
  const b = e.target.closest(".idea > button"); if (!b) return;
  const li = b.parentElement, open = li.dataset.open !== "true";
  li.dataset.open = open; b.setAttribute("aria-expanded", open);
});
renderPage();

/* ---------- editor ---------- */
if (EDITOR) {
  const NEW = {
    about: () => "",
    facts: () => ["", ""],
    grades: () => ["", ""],
    links: () => ["", ""],
    ideas: () => ({ title: "New project", pitch: "", status: "Brewing", problem: "", approach: "", stack: [] })
  };
  const P = p => esc(JSON.stringify(p));
  const text = (label, key, area) => `<label>${label}</label>` + (area
    ? `<textarea data-p="${P([key])}">${esc(ME[key])}</textarea>`
    : `<input data-p="${P([key])}" value="${esc(ME[key])}">`);
  const pairs = (key, ph) => ME[key].map((r, i) => `
    <div class="row">
      <input data-p="${P([key,i,0])}" value="${esc(r[0])}" placeholder="${ph[0]}" aria-label="${ph[0]}">
      <input data-p="${P([key,i,1])}" value="${esc(r[1])}" placeholder="${ph[1]}" aria-label="${ph[1]}">
      <button type="button" class="x" data-del="${P([key,i])}">Remove</button>
    </div>`).join("") + `<button type="button" class="add" data-add="${key}">+ Add</button>`;

  function renderEditor(){
    $("edBody").innerHTML = `
      <h3>Top of page</h3>
      ${text("Full name", "name")}
      ${text("First name (big greeting)", "firstName")}
      ${text("Intro", "intro", true)}
      ${text("Second intro line", "introMore", true)}
      ${text("Currently…", "now")}

      <h3>About</h3>
      ${text("Heading", "aboutTitle")}
      ${text("Subtitle", "role")}
      <label>Paragraphs</label>
      ${ME.about.map((p, i) => `<div class="row one"><textarea data-p="${P(["about",i])}" aria-label="Paragraph ${i+1}">${esc(p)}</textarea><button type="button" class="x" data-del="${P(["about",i])}">Remove</button></div>`).join("")}
      <button type="button" class="add" data-add="about">+ Add paragraph</button>
      <label>Facts</label>
      ${pairs("facts", ["Label", "Value"])}

      <h3>Academics</h3>
      ${text("Heading", "gradesTitle")}
      ${pairs("grades", ["Score", "What it's for"])}

      <h3>Projects</h3>
      ${text("Heading", "ideasTitle")}
      ${text("Description", "ideasLede", true)}
      ${ME.ideas.map((it, i) => `
        <div class="card">
          <div class="card-top"><button type="button" class="x" data-del="${P(["ideas",i])}">Remove project</button></div>
          <label>Project name</label><input data-p="${P(["ideas",i,"title"])}" value="${esc(it.title)}">
          <label>Status</label><select data-p="${P(["ideas",i,"status"])}">${STATUSES.map(s => `<option${s===it.status?" selected":""}>${s}</option>`).join("")}</select>
          <label>One-line pitch</label><input data-p="${P(["ideas",i,"pitch"])}" value="${esc(it.pitch)}">
          <label>The problem</label><textarea data-p="${P(["ideas",i,"problem"])}">${esc(it.problem)}</textarea>
          <label>My plan</label><textarea data-p="${P(["ideas",i,"approach"])}">${esc(it.approach)}</textarea>
          <label>Likely tools (comma separated)</label><input data-p="${P(["ideas",i,"stack"])}" data-csv value="${esc((it.stack||[]).join(", "))}">
        </div>`).join("")}
      <button type="button" class="add" data-add="ideas">+ Add project</button>

      <h3>Contact</h3>
      ${text("Heading", "contactTitle")}
      ${text("Description", "contactLede", true)}
      ${text("Email", "email")}
      <label>Links</label>
      ${pairs("links", ["Name", "https://…"])}`;
  }
  const saveDraft = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(ME)); } catch {} };
  const update = () => { saveDraft(); renderPage(); };

  $("edBody").addEventListener("input", e => {
    const el = e.target; if (!el.dataset.p) return;
    const path = JSON.parse(el.dataset.p), last = path.pop();
    const obj = path.reduce((o, k) => o[k], ME);
    obj[last] = el.hasAttribute("data-csv") ? el.value.split(",").map(s => s.trim()).filter(Boolean) : el.value;
    update();
  });
  $("edBody").addEventListener("click", e => {
    const add = e.target.closest("[data-add]"), del = e.target.closest("[data-del]");
    if (add) { ME[add.dataset.add].push(NEW[add.dataset.add]()); update(); renderEditor(); }
    if (del) {
      const [key, i] = JSON.parse(del.dataset.del);
      if (key === "ideas" && !confirm(`Remove "${ME.ideas[i].title}"?`)) return;
      ME[key].splice(i, 1); update(); renderEditor();
    }
  });

  const open = on => { $("ed").hidden = !on; $("edOpen").hidden = on; document.body.classList.toggle("ed-open", on); };
  $("edOpen").addEventListener("click", () => open(true));
  $("edClose").addEventListener("click", () => open(false));
  $("edDiscard").addEventListener("click", () => {
    if (!confirm("Throw away your changes and go back to what's in the file?")) return;
    try { localStorage.removeItem(DRAFT_KEY); } catch {}
    ME = structuredClone(ORIGINAL); renderPage(); renderEditor();
  });

  const dataJSON = () => JSON.stringify(ME, null, 2).replace(/</g, "\\u003c");
  const flash = (btn, msg) => { const t = btn.textContent; btn.textContent = msg; setTimeout(() => btn.textContent = t, 2500); };
  async function copyData(btn){
    try { await navigator.clipboard.writeText(dataJSON()); flash(btn, "Copied!"); }
    catch { prompt("Copy this:", dataJSON()); }
    $("edNote").textContent = "Copied. In index.html, replace everything between <script type=\"application/json\" id=\"me-data\"> and <\/script> with it.";
  }
  $("edCopy").addEventListener("click", e => copyData(e.target));
  $("edDownload").addEventListener("click", async e => {
    const btn = e.target, RE = /(<script type="application\/json" id="me-data">)[\s\S]*?(<\/script>)/;
    let src = "";
    try { src = await (await fetch(location.href.split("#")[0], { cache: "no-store" })).text(); } catch {}
    if (!RE.test(src)) { copyData(btn); $("edNote").textContent = "Chrome can't build the file when the page is opened from your computer, so your data was copied instead. In index.html, replace everything between <script type=\"application/json\" id=\"me-data\"> and <\/script> with it. (On the live site, Download works.)"; return; }
    const out = src.replace(RE, (m, a, b) => `${a}\n${dataJSON()}\n${b}`);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "text/html" }));
    a.download = "index.html"; a.click(); URL.revokeObjectURL(a.href);
    flash(btn, "Downloaded!");
    $("edNote").textContent = "Now go to your GitHub repository → Add file → Upload files, drop in this index.html and commit. Your site updates in 1–2 minutes.";
  });

  renderEditor();
  open(true);
}
</script>
</body>
</html>
